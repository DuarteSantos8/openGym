name: Publish Helm chart

# The chart is published from a published release, never from a bare tag, for the same reason the
# images are: a tag that is later deleted (the versioning rule consolidates unreleased tags) would
# otherwise leave its chart behind in the registry. See issue #87.
#
# Where: OCI on GHCR, `oci://ghcr.io/duartesantos8/opengym` -- the registry the images already use.
# A consumer adds it as a dependency instead of cloning this repo:
#
#   dependencies:
#     - name: opengym
#       version: 1.4.5
#       repository: "oci://ghcr.io/duartesantos8"
#
# The published chart version is the app version from the release tag, not the development version in
# helm/Chart.yaml, so a dependency pins the app it runs. Two tags are published, both by helm itself
# (no second binary like crane): the exact `X.Y.Z` and the minor `X.Y`. There is no `latest` -- helm
# rejects a non-semver version -- and a pinned dependency is the norm for a Helm dependency anyway.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # On a release the ref is refs/tags/vX.Y.Z; a manual run has no tag, so it publishes the
      # chart version that is in helm/Chart.yaml instead.
      - name: Chart version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(sed -n 's/^version:[[:space:]]*\([^[:space:]]*\).*/\1/p' helm/Chart.yaml)" >> "$GITHUB_OUTPUT"
          fi

      - name: Versions agree with the release tag
        if: github.event_name == 'release'
        run: node scripts/ci/release-check.mjs "$GITHUB_REF_NAME"

      - name: Install helm
        uses: Azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - name: Lint and package
        run: |
          set -euo pipefail
          helm lint helm/
          # Two tags, both made by helm (a second package/push needs no crane). The minor tag is
          # skipped when it would equal the exact version (e.g. a bare X.Y manual run).
          V="${{ steps.version.outputs.version }}"
          helm package helm/ --version "$V" --destination dist
          [ "${V%.*}" != "$V" ] && helm package helm/ --version "${V%.*}" --destination dist
          ls -l dist

      - name: Lowercase owner (registry names must be lowercase)
        id: repo
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Publish to GHCR
        run: |
          set -euo pipefail
          REG="oci://ghcr.io/${{ steps.repo.outputs.owner }}/opengym"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          V="${{ steps.version.outputs.version }}"
          # helm push prints what it pushed. (helm ls lists Kubernetes releases, not OCI charts; that
          # would need crane or the registry API, so there is no list step.)
          helm push dist/opengym-${V}.tgz "$REG"
          [ "${V%.*}" != "$V" ] && helm push dist/opengym-${V%.*}.tgz "$REG"
