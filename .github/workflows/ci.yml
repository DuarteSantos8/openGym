name: Fork CI and GHCR

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  # Manual validation never publishes; publishing requires a push to main.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    if: github.repository == 'illya228666/openGym'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Check deployment transaction without production access
        run: |
          bash -n deploy/opengym-deploy
          python3 deploy/test_deploy.py
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            frontend/package-lock.json
            mcp/package-lock.json
      - run: npm ci
      - run: npm ci --omit=optional
        working-directory: api
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm ci
        working-directory: mcp
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/OpenGym.Nutrition.Tests/OpenGym.Nutrition.Tests.csproj -c Release
        working-directory: nutrition
      - run: npm test
        working-directory: api
      - run: npm test
        working-directory: frontend
      - run: npm test
        working-directory: mcp
      - run: npm run build
        working-directory: frontend
      - run: node scripts/check-locales.mjs
        working-directory: frontend
      - run: node scripts/check-source-strings.mjs
        working-directory: frontend
      - run: npm run test:fatigue-probe
        working-directory: frontend
      - run: npm run check:node-loadable
        working-directory: mcp
      - run: node api/scripts/check-core-loadable.mjs
      - run: node scripts/build-coach-assets.mjs --check
      - run: node scripts/build-api-docs.mjs --check

  images:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build API (default target)
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/Dockerfile
          target: default
          load: true
          tags: opengym-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          labels: org.opencontainers.image.source=https://github.com/illya228666/openGym
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=main-${{ github.sha }}
      - name: Build Web (root context includes api/coach/core)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./web/Dockerfile
          load: true
          tags: opengym-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          labels: org.opencontainers.image.source=https://github.com/illya228666/openGym
          build-args: |
            APP_BUILD=${{ github.sha }}
            VCS_REF=${{ github.sha }}
            VERSION=main-${{ github.sha }}
      - name: Build Nutrition (.NET 10)
        uses: docker/build-push-action@v7
        with:
          context: ./nutrition
          file: ./nutrition/Dockerfile
          load: true
          tags: opengym-nutrition:ci
          cache-from: type=gha,scope=nutrition
          cache-to: type=gha,mode=max,scope=nutrition
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=main-${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Boot all three images and check authentication end to end
        run: |
          docker network create opengym-ci
          docker volume create opengym-ci-nutrition
          docker run -d --name api --network opengym-ci -e DATA_DIR=/data -e PASSWORD_LOGIN=1 -e NUTRITION_URL=http://nutrition:8080 opengym-api:ci
          docker run -d --name nutrition --network opengym-ci -v opengym-ci-nutrition:/data -e OpenGym__ApiBaseUrl=http://api:3000 -e NO_PROXY=api,nutrition,localhost,127.0.0.1 opengym-nutrition:ci
          docker run -d --name web --network opengym-ci -p 127.0.0.1:8080:80 opengym-web:ci
          curl --retry 30 --retry-delay 1 --retry-all-errors --fail http://localhost:8080/api/health
          curl --fail http://localhost:8080/api/config
          curl --fail http://localhost:8080/ > /tmp/opengym.html
          grep -q 'type="module"' /tmp/opengym.html
          docker exec -i api node --input-type=module < scripts/ci/nutrition-internal-smoke.mjs
          node scripts/ci/nutrition-smoke.mjs http://localhost:8080
          docker rm -f nutrition
          docker run -d --name nutrition --network opengym-ci -v opengym-ci-nutrition:/data -e OpenGym__ApiBaseUrl=http://api:3000 -e NO_PROXY=api,nutrition,localhost,127.0.0.1 opengym-nutrition:ci
          docker exec -i api node --input-type=module < scripts/ci/nutrition-internal-smoke.mjs
          node scripts/ci/nutrition-smoke.mjs http://localhost:8080 --verify-persistence
      - name: Container diagnostics
        if: failure()
        run: |
          docker logs api || true
          docker logs web || true
          docker logs nutrition || true
      - name: Log in to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the images that passed smoke checks (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SHA: ${{ github.sha }}
        run: |
          for image in api web nutrition; do
            remote="ghcr.io/illya228666/opengym-$image"
            docker tag "opengym-$image:ci" "$remote:sha-$SHA"
            docker tag "opengym-$image:ci" "$remote:latest"
            docker push "$remote:sha-$SHA"
            docker push "$remote:latest"
          done
      - name: Clean up smoke containers
        if: always()
        run: |
          docker rm -f web api nutrition || true
          docker volume rm opengym-ci-nutrition || true
          docker network rm opengym-ci || true
