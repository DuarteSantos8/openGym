# LIFTIQ-FORK: publishes the standalone (phone-only, no backend, no demo data) build of this fork
# to GitHub Pages: https://louraaaaaaaa.github.io/openGym/
#
# Same steps as upstream's pages.yml (which is left untouched and must never run on this fork:
# it triggers on pushes to `main`, and `main` is never pushed here, see LIFTIQ-FORK.md), but it
# builds with VITE_STANDALONE=1 and runs from the `liftiq` branch.
name: Deploy LiftIQ standalone to GitHub Pages

on:
  push:
    branches: [liftiq]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_STANDALONE: '1'
      # The 180 px stills and animations from catalogue/media, served next to the app (unmodified,
      # together with exercise-media/NOTICE.md, as the non-commercial fork permission requires)
      - run: node scripts/catalogue/stage-media.mjs frontend/dist
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
