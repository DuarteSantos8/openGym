# Builds the Android app (an APK) of Reta-rpm.fr on GitHub's servers, for free.
#
# Run it: open the Actions tab of the fork, pick "Android APK", press "Run workflow". It also runs
# by itself when the salles-et-da branch is pushed. When it is green (about 10 minutes), open the
# run and download the artifact "reta-rpm-apk" at the bottom of the page: a zip holding the .apk.
#
# The steps are the ones test.yml already uses for its Android job, minus the unit tests. The APK is
# a debug build, signed with the debug key, which is fine to install on your own phone. It carries
# the repo's own 180 px exercise animations (see NOTICE.md for their licence).
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [salles-et-da]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - name: Phone bundle + cap sync
        run: npm run build:mobile
        working-directory: frontend
      - name: Build the APK
        working-directory: frontend/android
        run: ./gradlew --no-daemon assembleSideloadDebug
      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: reta-rpm-apk
          path: frontend/android/app/build/outputs/apk/sideload/debug/*.apk
          if-no-files-found: error
