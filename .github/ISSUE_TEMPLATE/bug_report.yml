name: Bug report
description: Something in openGym is broken or not working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What did you do?
      description: Steps to reproduce, as precisely as you can.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include error messages, console output, or screenshots if you have them.
    validations:
      required: true

  - type: dropdown
    id: setup
    attributes:
      label: How are you running openGym?
      description: Pick all that apply, e.g. the iPhone app connected to your own server.
      multiple: true
      options:
        - iPhone app (App Store or TestFlight)
        - Apple Watch app
        - Android app (APK from GitHub or opengym.ch)
        - Android app (Google Play)
        - Phone app on its own, no server ("Use on this device")
        - Phone app connected to my server
        - Web app in the browser, self-hosted (docker compose)
        - Web app on someone else's instance
        - Demo (opengym.ch/demo)
        - Frontend dev server (npm run dev)
        - Other / not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: openGym version
      description: In the app under Settings → About. For the server, the image tag you run.
      placeholder: e.g. 1.4.2 (App Store), server 1.4.2
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Device, OS & browser
      placeholder: e.g. iPhone 15 on iOS 26.1, Pixel 8 on Android 16, Chrome 141 on Windows
    validations:
      required: true

  - type: checkboxes
    id: passkey
    attributes:
      label: Is this about login / passkeys?
      description: >
        Most login issues are an `RP_ID`/`ORIGIN` mismatch — check your `.env` against the
        domain you're accessing openGym from before reporting. See the
        [self-hosting guide](../../docs/SELF_HOSTING.md).
      options:
        - label: Yes, this is a login/passkey issue and I've already checked RP_ID/ORIGIN
