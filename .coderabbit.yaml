# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews for openGym. Most PRs target the release branch (release-x.y.z), not main,
# so auto review has to cover those too. Generated files are skipped: review their source instead.
language: "en-US"

tone_instructions: >
  Short and concrete. Point out real bugs, data loss, sync problems, security issues and
  regressions, with why and how to fix. Skip style preferences. If nothing is wrong, say so.

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  poem: false
  sequence_diagrams: false
  suggested_labels: false
  suggested_reviewers: false

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - "main"
      - "release-.*"
    ignore_title_keywords:
      - "wip"
      - "skip review"

  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/*.lock"
    - "!**/package-lock.json"
    # generated by scripts/catalogue/build.mjs (review catalogue/exercises instead)
    - "!frontend/src/lib/exercises-data.js"
    - "!frontend/src/lib/exercise-muscle-map.json"
    - "!frontend/src/instr/**"
    - "!frontend/src/exercise-names/**"
    - "!frontend/src/exercise-desc/**"
    - "!api/coach/core/library-data.js"
    # generated watch strings (frontend/ios/ci/watch-strings.mjs, garmin/garmin-strings.mjs)
    - "!frontend/ios/App/**/*.lproj/Localizable.strings"
    - "!frontend/garmin/resources-*/strings/strings.xml"
    - "!catalogue/media/**"

  path_instructions:
    - path: "frontend/src/locales/**"
      instructions: |
        Translation packs. Check only: placeholders like {n} kept exactly, no keys missing or
        added compared to en.js, no English left untranslated by mistake, no HTML or code broken.
        Do not comment on wording style unless it is clearly wrong or offensive.
    - path: "frontend/src/**/*.{js,jsx}"
      instructions: |
        React + Vite app, offline-first; user data lives on the device and syncs with _rev/baseRev.
        Watch for: lost or overwritten user data, sync merge mistakes, missing migrations of saved
        state, hard-coded user-facing strings (all text goes through the locale packs), and
        user-facing text with em dashes (house style: none).
    - path: "frontend/ios/**/*.swift"
      instructions: |
        watchOS / iOS native code. Keep the Apple Watch, Wear OS (frontend/android/wear) and
        Garmin (frontend/garmin) behaviour in step; flag a change that only fixes one of them.
    - path: "frontend/android/**/*.{kt,java}"
      instructions: |
        Android / Wear OS native code. The fdroid flavour must not pull in Google Play services,
        Firebase, ML Kit or the Garmin SDK. Keep Wear OS in step with the Apple Watch (WatchCore).
    - path: "api/**"
      instructions: |
        Node API, self-hosted. Check auth and permission checks, input validation, rate limits and
        that nothing leaks another user's data.
    - path: "catalogue/exercises/**"
      instructions: |
        Exercise catalogue data. Check that ids stay stable, muscle maps make sense for the
        movement, and steps describe what the animation shows.

chat:
  auto_reply: true
