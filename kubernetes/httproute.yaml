---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: opengym-tls
  namespace: fitness
spec:
  dnsNames:
    - opengym.example.com
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
  secretName: opengym-tls
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: envoy-gateway-system
  to:
    - group: ""
      kind: Service
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opengym
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - opengym.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: opengym
          port: 80
