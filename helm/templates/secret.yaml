apiVersion: v1
kind: Secret
metadata:
  name: {{ include "helm.fullname" . }}-api
  labels:
    {{- include "helm.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $k, $v := .Values.api.secretEnv }}
  {{- if ne (toString $v) "" }}
  {{ $k }}: {{ toString $v | b64enc }}
  {{- end }}
  {{- end }}
