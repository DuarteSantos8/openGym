apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "helm.fullname" . }}-api
  labels:
    {{- include "helm.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.api.service.port | quote }}
  {{- range $k, $v := .Values.api.env }}
  {{- if ne (toString $v) "" }}
  {{ $k }}: {{ toString $v | quote }}
  {{- end }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "helm.fullname" . }}-web
  labels:
    {{- include "helm.labels" . | nindent 4 }}
data:
  NGINX_PORT: {{ .Values.web.service.port | quote }}
  PORT: {{ .Values.api.service.port | quote }}
  # Both containers share the pod's network, so the API is on localhost.
  BACKEND: "127.0.0.1"
  {{- range $k, $v := .Values.web.env }}
  {{- if ne (toString $v) "" }}
  {{ $k }}: {{ toString $v | quote }}
  {{- end }}
  {{- end }}
