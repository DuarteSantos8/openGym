// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.wear_kotlin_version = '2.2.20'
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        // Kotlin, Compose and kotlinx.serialization for the Wear OS module (wear/) only; app/ stays
        // Java and builds exactly as before.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$wear_kotlin_version"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$wear_kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$wear_kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}
