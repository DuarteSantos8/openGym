apply plugin: 'com.android.application'

android {
    namespace = "ch.duartesantos.opengym"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "ch.duartesantos.opengym"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 30
        versionName "1.4.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // The barcode scanner's ML Kit library ships a native build for four CPU families.
            // Phones are ARM; the two x86 builds only serve emulators and a few Chromebooks, which
            // run ARM code through translation anyway. Leaving them out takes about 12 MB off
            // the APK. Release only: the debug build keeps x86_64 for the emulator test rig.
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
        debug {
            // Test build installs side-by-side with the real app: its own applicationId, so both
            // can live on one device. The name/icon label is overridden by the debug resource
            // overlay in src/debug/res. The release build (the "real" app) is untouched.
            applicationIdSuffix ".test"
        }
    }
    // Where the app is installed from. "sideload" is the APK on GitHub and opengym.ch: it checks
    // GitHub for a newer release and installs it itself (InstallPlugin, REQUEST_INSTALL_PACKAGES).
    // "play" is the Google Play build: Play installs the updates, so the updater, its permission
    // and its plugin are left out (Play does not allow an app to update itself). Same
    // applicationId and the same signing key, so a phone can move from one to the other without
    // losing its data. The page asks which one it runs in (ChannelPlugin, lib/channel.js).
    // "fdroid" is the build F-Droid makes from the public source: nothing from Google Play services
    // or ML Kit (see the F-Droid block below the dependencies), no updater (F-Droid updates it),
    // the repository's 180 px animations only. Same applicationId and versionCode as the APK;
    // F-Droid signs it with its own key unless its build matches ours (docs/APP_STORES.md).
    flavorDimensions = ["channel"]
    productFlavors {
        sideload {
            dimension = "channel"
            isDefault = true
            buildConfigField "String", "CHANNEL", '"sideload"'
            buildConfigField "boolean", "BACKGROUND_LOCATION", "true"
        }
        play {
            dimension = "channel"
            buildConfigField "String", "CHANNEL", '"play"'
            buildConfigField "boolean", "BACKGROUND_LOCATION", project.hasProperty('playWithoutBackgroundLocation') ? "false" : "true"
        }
        fdroid {
            dimension = "channel"
            buildConfigField "String", "CHANNEL", '"fdroid"'
            // The gym reminder needs no Play services (the platform's proximity alerts).
            buildConfigField "boolean", "BACKGROUND_LOCATION", "true"
        }
    }
    // The Wear OS link (WatchBridgePlugin, WatchListenerService) talks to the watch through the
    // Wearable Data Layer of Google Play services: in the APK and the Play build only. The F-Droid
    // build has its own WatchBridgePlugin that answers "no watch" (src/fdroid).
    sourceSets {
        sideload.java.srcDirs += 'src/gms/java'
        play.java.srcDirs += 'src/gms/java'
    }
    // Plan B for Google Play's background-location review (docs/APP_STORES.md): with
    // -PplayWithoutBackgroundLocation the Play build leaves out ACCESS_BACKGROUND_LOCATION, so no
    // declaration is needed. The app then hides the gym reminder (ChannelPlugin says
    // BACKGROUND_LOCATION false, lib/channel.js). Off by default.
    if (project.hasProperty('playWithoutBackgroundLocation')) {
        sourceSets.play.manifest.srcFile 'src/playNoBackgroundLocation/AndroidManifest.xml'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Writing workouts and weigh-ins to Health Connect (#200, HealthConnectPlugin). Off until the
    // user turns it on.
    implementation "androidx.health.connect:connect-client:$healthConnectVersion"
    // The sharper animations as Play asset packs (AnimationPacksPlugin in src/play): the Play
    // build only. The sideloaded APK has no Play Store behind it and keeps its built-in ones.
    playImplementation "com.google.android.play:asset-delivery:$assetDeliveryVersion"
    // The Wear OS watch app's link (WatchBridgePlugin, WatchListenerService in src/gms): the
    // Wearable Data Layer of Google Play services. The APK and the Play build have it; on a phone
    // without Play services or without a watch every call just answers "no watch" and nothing
    // else changes. Not in the F-Droid build.
    sideloadImplementation "com.google.android.gms:play-services-wearable:$playServicesWearableVersion"
    playImplementation "com.google.android.gms:play-services-wearable:$playServicesWearableVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // The real org.json for the JVM tests (WidgetContentTest): android.jar only has stubs of it.
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// ---- The F-Droid build: no ML Kit ----
// capacitor.build.gradle (generated by `cap sync`) adds every Capacitor plugin to all builds. The
// check-in scanner's (@capacitor-mlkit/barcode-scanning) is Google's ML Kit and Play services
// code scanner, closed source: the F-Droid build leaves the plugin out, and with it everything
// it brings (ML Kit, play-services-*, Firebase components, datatransport). The page then scans
// with the WebView's own camera and jsQR, as in a browser (lib/scan.js, components/CameraScan.jsx).
// Its entry also has to go from capacitor.plugins.json, or Capacitor would fail to load every
// plugin over the one missing class: the F-Droid build gets a copy without it (its own assets,
// which win over main's).
def fdroidDroppedPlugins = ['@capacitor-mlkit/barcode-scanning']
configurations.configureEach { c ->
    if (c.name.toLowerCase().contains('fdroid')) {
        c.exclude module: 'capacitor-mlkit-barcode-scanning'
    }
}
def fdroidAssetsDir = layout.buildDirectory.dir('generated/fdroid-assets')
def fdroidPluginList = tasks.register('fdroidCapacitorPlugins') {
    def src = file('src/main/assets/capacitor.plugins.json')
    inputs.files(src).optional()
    inputs.property('dropped', fdroidDroppedPlugins)
    outputs.dir(fdroidAssetsDir)
    doLast {
        def outDir = fdroidAssetsDir.get().asFile
        outDir.mkdirs()
        if (!src.exists()) throw new GradleException('No capacitor.plugins.json: run the mobile build (npm run build:mobile) first')
        def kept = new groovy.json.JsonSlurper().parse(src).findAll { !(it.pkg in fdroidDroppedPlugins) }
        new File(outDir, 'capacitor.plugins.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(kept)) + '\n'
    }
}
android.sourceSets.fdroid.assets.srcDir(fdroidAssetsDir)
tasks.configureEach { t ->
    if (t.name ==~ /(merge|generate)Fdroid\w*Assets|lintVitalAnalyzeFdroid\w*|.*Fdroid\w*Lint\w*/) t.dependsOn fdroidPluginList
}

// The asset packs themselves, generated on the release machine only (settings.gradle).
if (rootProject.file('asset-packs.app.gradle').exists()) {
    apply from: rootProject.file('asset-packs.app.gradle')
}
