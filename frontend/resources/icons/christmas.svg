<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <!-- openGym app icon "christmas", drawn by hand like "halloween" (scripts/app-icons.mjs renders it,
       it does not write it). The dumbbell is the glyph of resources/icon.svg in the openGym lime, on
       a winter night: a Santa hat on the left plate, the right plate wrapped as a present with a red
       ribbon and a bow, snowflakes around. Only rect, circle, line, polyline, polygon and one
       radialGradient: what the script knows how to draw. -->
  <defs>
    <radialGradient id="night" gradientUnits="userSpaceOnUse" cx="256" cy="300" r="380">
      <stop offset="0" stop-color="#22356a"/>
      <stop offset="1" stop-color="#070b16"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#night)"/>
  <!-- Everything that matters stays within 228 of the centre: Android cuts the art to a circle and
       only promises the middle 66 dp of its 72, and iOS rounds the corners off. -->
  <!-- snowflakes: six arms each, a little V on every arm -->
  <g stroke="#dbe9ff" stroke-width="6">
    <line x1="96.0" y1="112.0" x2="156.0" y2="112.0"/>
    <line x1="144.0" y1="112.0" x2="150.8" y2="105.2"/>
    <line x1="144.0" y1="112.0" x2="150.8" y2="118.8"/>
    <line x1="108.0" y1="112.0" x2="101.2" y2="118.8"/>
    <line x1="108.0" y1="112.0" x2="101.2" y2="105.2"/>
    <line x1="111.0" y1="86.0" x2="141.0" y2="138.0"/>
    <line x1="135.0" y1="127.6" x2="144.3" y2="130.1"/>
    <line x1="135.0" y1="127.6" x2="132.5" y2="136.9"/>
    <line x1="117.0" y1="96.4" x2="107.7" y2="93.9"/>
    <line x1="117.0" y1="96.4" x2="119.5" y2="87.1"/>
    <line x1="141.0" y1="86.0" x2="111.0" y2="138.0"/>
    <line x1="117.0" y1="127.6" x2="119.5" y2="136.9"/>
    <line x1="117.0" y1="127.6" x2="107.7" y2="130.1"/>
    <line x1="135.0" y1="96.4" x2="132.5" y2="87.1"/>
    <line x1="135.0" y1="96.4" x2="144.3" y2="93.9"/>
  </g>
  <g stroke="#dbe9ff" stroke-width="5">
    <line x1="372.0" y1="392.0" x2="424.0" y2="392.0"/>
    <line x1="413.6" y1="392.0" x2="419.5" y2="386.1"/>
    <line x1="413.6" y1="392.0" x2="419.5" y2="397.9"/>
    <line x1="382.4" y1="392.0" x2="376.5" y2="397.9"/>
    <line x1="382.4" y1="392.0" x2="376.5" y2="386.1"/>
    <line x1="385.0" y1="369.5" x2="411.0" y2="414.5"/>
    <line x1="405.8" y1="405.5" x2="413.8" y2="407.7"/>
