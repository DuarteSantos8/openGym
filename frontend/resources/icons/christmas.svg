    <line x1="399.2" y1="132.3" x2="400.5" y2="137.3"/>
    <line x1="399.2" y1="132.3" x2="394.3" y2="133.6"/>
    <line x1="408.8" y1="115.7" x2="407.5" y2="110.7"/>
    <line x1="408.8" y1="115.7" x2="413.7" y2="114.4"/>
