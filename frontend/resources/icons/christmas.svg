    <line x1="390.2" y1="378.5" x2="382.2" y2="376.3"/>
    <line x1="390.2" y1="378.5" x2="392.4" y2="370.5"/>
    <line x1="411.0" y1="369.5" x2="385.0" y2="414.5"/>
    <line x1="390.2" y1="405.5" x2="392.4" y2="413.5"/>
    <line x1="390.2" y1="405.5" x2="382.2" y2="407.7"/>
    <line x1="405.8" y1="378.5" x2="403.6" y2="370.5"/>
