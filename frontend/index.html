<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<script>
  // Set direction before first paint so an Arabic profile never flashes as LTR.
  // The app re-applies this on every language change (lib/i18n.js setLang).
  // i18n-core RTL_LANGS is the runtime source of truth — keep this list in sync.
  try {
    var s = JSON.parse(localStorage.getItem('gym_state_v1') || '{}');
    var l = s.lang || ((navigator.language || '').slice(0, 2) === 'ar' ? 'ar' : 'en');
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
    // The theme too, so the mark below is drawn in the right ink and a light profile never flashes
    // dark. App.jsx resolveTheme is the source of truth and re-applies it.
    var th = s.theme;
    if (th !== 'light' && th !== 'dark') th = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = th;
  } catch (e) {}
</script>
<title>Gains</title>
<meta name="description" content="Personal gym & body weight tracker">
<meta name="theme-color" content="#0c0b0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gains">
<!-- use-credentials: browsers fetch the manifest without cookies, even same-origin; behind an auth
     proxy (Authelia, Cloudflare Access, Teleport…) that fetch is a login redirect and the Home Screen
     icon comes out generic. iOS 26 reads the icon from the manifest, so this is where it shows. -->
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="brand/icon-180.png">
<link rel="icon" type="image/svg+xml" href="brand/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="brand/favicon-32.png">
<link rel="icon" href="brand/favicon.ico" sizes="48x48">
</head>
<body>
<!-- The first frame, until React draws its own (BootMark in App.jsx is the same mark in the same place). -->
<div id="root"><div class="boot-mark"><svg class="brand-mark" viewBox="21.8 21.8 56.4 56.4" width="1em" height="1em" aria-hidden="true" focusable="false"><defs><mask id="boot-groove" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><path d="M69.30 33.80A25.2 25.2 0 1 0 75.2 50V48.8H52.5" fill="none" stroke="#000" stroke-width="1.1" stroke-linejoin="round"/></mask></defs><path mask="url(#boot-groove)" d="M68.39 34.57A24 24 0 1 0 74 50H51" fill="none" stroke="currentColor" stroke-width="8.4" stroke-miterlimit="4"/></svg></div></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
