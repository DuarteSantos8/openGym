# Not "opengym": upstream's root cloudflare/ folder uses that name, and a deploy from there would
# replace this app. A different name makes such a deploy create a separate, harmless Worker.
name = "opengym-pv"
main = "worker.js"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]
# The coach adapters resolve paths off import.meta.url, which a bundle does not have.
define = { "import.meta.url" = "\"file:///bundle/worker.js\"" }

# Built by build.mjs: the frontend plus the 180 px exercise media at /exercise-media/.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "opengym"
database_id = "65cc1867-b6df-42b7-aeb1-a3442982224f"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "opengym-media"

[[durable_objects.bindings]]
name = "API"
class_name = "Api"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Api"]

[vars]
RP_ID = "gym.petervaleria.com"
ORIGIN = "https://gym.petervaleria.com"
RP_NAME = "openGym"
FIRST_USER_ADMIN = "1"
INVITE_ONLY = "1"
ALLOW_GUEST = "0"
# Uploads are held in the object's memory (128 MB), so the caps stay well under it.
MEDIA_QUOTA_MB = "50"
MEDIA_VIDEO_MAX_MB = "20"
MEDIA_GIF_MAX_MB = "6"
MEDIA_MIN_FREE_MB = "0"
TRUST_PROXY = "1"

# Wakes the server every 5 minutes so push reminders go out with the app closed (worker.js).
[triggers]
crons = ["*/5 * * * *"]

[[routes]]
pattern = "gym.petervaleria.com"
custom_domain = true

# Outbound calls (the coach) use the platform fetch, not undici.
[alias]
"undici" = "./undici-shim.js"

[observability]
enabled = true
